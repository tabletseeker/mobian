name: Build Mobian

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device'
        required: true
        type: choice
        options:
          - amd64
          - pinephone
          - pinephonepro
          - librem5
          - pinetab
        default: amd64
      build_type:
        description: 'Image Type'
        required: true
        type: choice
        options:
          - regular
          - installer
        default: regular
      suite:
        description: 'Suite'
        required: true
        type: choice
        options:
          - sid
          - forky
          - trixie
          - bookworm
        default: forky
      kernel_project:
        description: 'Choose Target Upstream Kernel Repository'
        required: true
        type: choice
        options:
          - default
          - linux-surface/linux-surface
          - t2linux/linux-t2
          - zen-kernel/zen-kernel
        default: default
      kernel_tag:
        description: 'Target Git Release Tag (e.g. debian-6.19.8-3)'
        required: false
        type: string
        default: ''
      use_keyboard:
        description: 'Default On-Screen-Keyboard?'
        required: false
        type: boolean
        default: true
      use_intel:
        description: 'Intel Chipset Support?'
        required: false
        type: boolean
        default: false
      create_release:
        description: 'Create a formal GitHub Release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Fallbacks for automated git tag pushes
  DEFAULT_DEVICE: 'amd64'
  DEFAULT_SUITE: 'forky'
  DEFAULT_BUILD_TYPE: 'regular'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fast Free Space
        run: |
          sudo rm -rf /usr/local/lib/android & 
          sudo rm -rf /usr/share/dotnet &
          wait

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debos bmap-tools squashfs-tools-ng xz-utils tar qemu-user-static wget

      - name: Process Custom Kernel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p kernel/
          PROJECT="${{ github.event.inputs.kernel_project }}"
          TARGET_TAG="${{ github.event.inputs.kernel_tag }}"
          
          : "${PROJECT:=default}"

          if [ "$PROJECT" != "default" ] && [ -n "$TARGET_TAG" ]; then
            echo "Targeting Project: $PROJECT with explicit Tag: $TARGET_TAG"
            gh release download "$TARGET_TAG" --repo "$PROJECT" \
              --pattern "linux-image-*.deb" --pattern "linux-headers-*.deb" \
              --dir kernel/ --clobber
          else
            echo "Selected stock default kernel or missing tag. Keeping kernel/ empty."
          fi

          echo "Verified kernel/ folder deployment contents:"
          ls -la kernel/

      - name: Run Build Script
        run: |
          find . -name "*.sh" -exec chmod +x {} +
          
          # Handle variables securely supporting both tag pushes and manual trigger forms
          DEVICE="${{ github.event.inputs.device }}"
          SUITE="${{ github.event.inputs.suite }}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          
          : "${DEVICE:=${{ env.DEFAULT_DEVICE }}}"
          : "${SUITE:=${{ env.DEFAULT_SUITE }}}"
          : "${BUILD_TYPE:=${{ env.DEFAULT_BUILD_TYPE }}}"
          
          # Setup base arguments
          ARGS=("-t" "$DEVICE" "-x" "$SUITE" "-Q" "15G" "-z" "-v")
          
          # Conditional boolean toggles 
          [ "$BUILD_TYPE" = "installer" ] && ARGS+=("-o")
          [ "${{ github.event.inputs.use_keyboard }}" = "true" ] || [ "${{ github.event_name }}" = "push" ] && ARGS+=("-K")
          [ "${{ github.event.inputs.use_intel }}" = "true" ] && ARGS+=("-L")
          
          # Automated path detector: If files exist in kernel/, append -k cleanly to build.sh
          if ls kernel/linux-image-*.deb >/dev/null 2>&1; then
            echo "Kernel directory populated. Enabling custom kernel build option (-k)..."
            ARGS+=("-k")
          fi
          
          sudo ./build.sh "${ARGS[@]}"
          
          # Track name for subsequent actions
          RAW_NAME=$(ls mobian-*.img.xz | head -n 1 | sed 's/.img.xz//')
          echo "IMAGE_NAME=$RAW_NAME" >> $GITHUB_ENV

      - name: Generate Checksums
        run: |
          sha256sum *.img.xz > "${{ env.IMAGE_NAME }}.sha256sums"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}
          path: |
            *.img.xz
            *.img.bmap
            *.sha256sums

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROJECT="${{ github.event.inputs.kernel_project }}"
          TARGET_TAG="${{ github.event.inputs.kernel_tag }}"
          
          : "${PROJECT:=default}"
          
          # 1. Parse repository project name cleanly to a short-name string (e.g. linux-surface -> surface)
          if [ "$PROJECT" != "default" ] && [ -n "$TARGET_TAG" ]; then
            SHORT_NAME=$(echo "$PROJECT" | sed 's|.*/||; s|linux-||g; s|-kernel||g')
          else
            SHORT_NAME=""
          fi

          # 2. Select the base tag name matching Master rules
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$SHORT_NAME" ]; then
              TAG_NAME="${{ env.IMAGE_NAME }}-${SHORT_NAME}"
            else
              TAG_NAME="$IMAGE_NAME"
            fi
          else
            TAG_NAME="${{ github.ref_name }}"
            [ -n "$SHORT_NAME" ] && TAG_NAME="${TAG_NAME}-${SHORT_NAME}"
          fi

          # 3. Handle the build type fallback logic
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          : "${BUILD_TYPE:=${{ env.DEFAULT_BUILD_TYPE }}}"

          # 4. Append "-live" if the build type is an installer
          if [ "$BUILD_TYPE" = "installer" ] ; then
            TAG_NAME="${TAG_NAME}-live"
          fi
          
          # 5. Initialize and format the primary metadata notes block (Updated Text Labels)
          if [ "$PROJECT" != "default" ] && [ -n "$TARGET_TAG" ]; then
            NOTES="* **Kernel Project:** $PROJECT"
            NOTES="$NOTES"$'\n'"* **Kernel Tag:** $TARGET_TAG"
          else
            NOTES="* **Custom Kernel:** False"
          fi

          NOTES="$NOTES"$'\n'"* **Debian Suite:** ${{ github.event.inputs.suite || env.DEFAULT_SUITE }}"
          
          if [ "${{ github.event.inputs.use_keyboard }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            NOTES="$NOTES"$'\n'"* **Default On-Screen Keyboard:** Enabled"
          else
            NOTES="$NOTES"$'\n'"* **Default On-Screen Keyboard:** Disabled"
          fi

          if [ "${{ github.event.inputs.use_intel }}" = "true" ]; then
            NOTES="$NOTES"$'\n'"* **Intel Chipset Support:** Enabled"
          else
            NOTES="$NOTES"$'\n'"* **Intel Chipset Support:** Disabled"
          fi

          # 6. INJECT EXPLICIT KERNEL SOURCE LINK ABOVE FULL CHANGELOG
          if [ "$PROJECT" != "default" ] && [ -n "$TARGET_TAG" ]; then
            NOTES="$NOTES"$'\n\n'"**Kernel Source:** https://github.com/${PROJECT}/releases/tag/${TARGET_TAG}"
          fi

          # 7. Create the release in a single clean pass
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes "$NOTES"

          gh release upload "$TAG_NAME" *.img.xz *.img.bmap *.sha256sums --clobber
