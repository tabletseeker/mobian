{{- $architecture := or .architecture "amd64" -}}
{{- $device := or .device "amd64" }}
{{- $nonfree := or .nonfree "false" }}
{{- $kernel := or .kernel "default" }}

architecture: {{ $architecture }}

## Copyright (C) 2026 tabletseeker <https://github.com/tabletseeker>
## See the LICENSE for file COPYING conditions.

actions:
  - action: apt
    recommends: false
    description: Install device-specific base packages
    packages:
      - grub-efi-amd64
      - grub-common
      - efibootmgr
      - os-prober
      - initramfs-tools
      - grub-efi
      - cpio

      {{ if eq $kernel "default" }}
      - linux-image-amd64
      {{ end }}
      {{ if eq $nonfree "true" }}
      - intel-microcode
      - amd64-microcode
      - firmware-misc-nonfree
      - firmware-libertas
      - firmware-iwlwifi
      - firmware-realtek
      - firmware-atheros
      {{ end }}
