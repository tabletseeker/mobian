actions:
  - action: apt
    recommends: false
    description: Install device-specific base packages
    packages:
      - mobian-librem5-tweaks
      - gnss-share
      - librem5-tweaks
      - network-manager
      - systemd-zram-generator
      - wys
      - rsync
