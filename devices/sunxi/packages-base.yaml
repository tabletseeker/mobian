actions:
  - action: apt
    recommends: false
    description: Install device-specific base packages
    packages:
      - eg25-manager
      - firmware-realtek
      - mobile-tweaks-common
      - network-manager
      - systemd-zram-generator
      - u-boot-menu
      - pinephone-tweaks
      - rsync
