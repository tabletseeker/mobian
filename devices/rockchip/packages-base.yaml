actions:
  - action: apt
    recommends: false
    description: Install device-specific base packages
    packages:
      - eg25-manager
      - firmware-brcm80211
      - firmware-misc-nonfree
      - network-manager
      - pinephone-tweaks
      - systemd-zram-generator
      - u-boot-menu
      - rsync
