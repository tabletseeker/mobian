{{- $architecture := or .architecture "arm64" -}}
{{- $family := or .family "sunxi" }}
{{- $nonfree := or .nonfree "false" -}}
{{- $device := or .device "pinephone" }}
{{- $partitiontable := or .partitiontable "gpt" }}
{{- $filesystem := or .filesystem "ext4" }}
{{- $environment := or .environment "phosh" -}}
{{- $image := or .image "mobian-installer.img" -}}
# FIX: Increased to 15GB to fit partitions
{{- $installersize := or .installersize "10GB" }}
{{- $installfs := or .installfs "installfs.tar.gz" }}
{{- $bootstart := or .bootstart "1MiB" }}
{{- $kernel := or .kernel "default" }}

architecture: {{ $architecture }}

## Copyright (C) 2026 tabletseeker <https://github.com/tabletseeker>
## See the LICENSE for file COPYING conditions.

actions:
  - action: unpack
    file: {{ $installfs }}

  - action: overlay
    source: rootfs-{{ $device }}-{{ $environment }}.sqfs
    destination: /var/lib/rootfs.sqfs

  - action: recipe
    recipe: include/partition-{{ $partitiontable }}.yaml
    variables:
      # FIX: Pass architecture for GUID logic
      architecture: {{ $architecture }}
      bootstart: {{ $bootstart }}
      filesystem: {{ $filesystem }}
      image: {{ $image }}
      imagesize: {{ $installersize }}
      installer: "true"

  - action: filesystem-deploy
    description: Deploy filesystem onto image

{{ if eq $nonfree "true" }}
  - action: run
    description: Enable non-free-firmware repos
    chroot: true
    script: scripts/setup-apt-nonfree.sh true
{{ end }}

  - action: recipe
    recipe: devices/{{ $family }}/packages-base-installer.yaml
    variables:
      device: {{ $device }}
      kernel: {{ $kernel }}
      nonfree: {{ $nonfree }}

  - action: recipe
    recipe: devices/{{ $family }}/bootloader.yaml
    variables:
      device: {{ $device }}
      image: {{ $image }}
      architecture: {{ $architecture }}

  - action: run
    description: Absolute final installer disk cleanup
    chroot: true
    command: |
      echo "Purging final live image APT lists..."
      rm -rf /var/lib/apt/lists/*
      rm -rf /var/cache/apt/archives/*
      
      echo "Flattening storage sectors..."
      sync
      echo "Zeroing free space for maximum compression..."
      # Using a 4k block size prevents dd from out-running the virtual disk filesystem buffer
      dd if=/dev/zero of=/zeros bs=4k conv=fsync || true
      sync
      rm -f /zeros
      sync
