# etc/calamares/modules/users.conf
# This module configures the default user, password, and groups.
---
# The groups the user will be added to. 
# Ensure 'sudo' is here so you can run administrative commands.
defaultGroups:
    - lp
    - video
    - network
    - storage
    - wheel
    - audio
    - sudo
    - input
    - render

# --- THE FIXES FOR "USER ALREADY EXISTS" ---

# 1. Allow the installer to work with a user that is already in /etc/passwd
# This stops the 'useradd' fatal error.
user_must_be_in_group: false

# 2. Do not set a separate root password; use sudo instead.
doNotSetPasswordForRoot: true
setRootPassword: false

# 3. GUI behavior
autologinDefault: true

# 4. Password requirements (optional, set to 'none' for mobile)
passwordRequirements:
    minLength: 4
    maxLength: -1
    allowEmpty: false

